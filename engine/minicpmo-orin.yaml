# The launcher supplies base_config from the pinned engine package.
session_mode: duplex
duplex_session:
  max_sessions: 1

# Initial candidates for a single SM 8.7 GPU. Measure all stages and system RAM
# before changing these limits or increasing the gateway's ordinary concurrency.
connectors:
  connector_of_shared_memory:
    extra:
      enable_hift_graph: false
      enable_cfm_graph: false
      enable_code2wav_encoder_graph: false
      cfm_fused_body: false

stages:
  - stage_id: 0
    max_num_seqs: 2
    kv_cache_dtype: int4_per_token_head
    # Chunk prefill work independently of the checkpoint's full Chat window.
    max_num_batched_tokens: 2048
    gpu_memory_utilization: 0.35
    enforce_eager: true
    media_io_kwargs:
      video:
        fps: 1
        num_frames: 16
    limit_mm_per_prompt:
      image: 16
      audio: 4
      video: 1

  - stage_id: 1
    max_num_seqs: 2
    kv_cache_dtype: int4_per_token_head
    max_num_batched_tokens: 4096
    gpu_memory_utilization: 0.10
    enforce_eager: true

  - stage_id: 2
    max_num_seqs: 2
    gpu_memory_utilization: 0.08

platforms:
  cuda:
    stages:
      - stage_id: 0
        # 36 layers × 8 heads × 2 × (64 INT4 bytes + 1 FP32 scale) per token.
        # A full Chat and the native duplex sliding window use about 1.79 GiB.
        kv_cache_memory_bytes: 2147483648
        attention_backend: TRITON_ATTN
      - stage_id: 1
        # Upstream CUDA sets an explicit 4 GiB allocation for 16 sequences.
        kv_cache_memory_bytes: 536870912
        # The upstream ARM64 FlashAttention 2 binary lacks Tegra SM 8.7.
        attention_backend: TRITON_ATTN
