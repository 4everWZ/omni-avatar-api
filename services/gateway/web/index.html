<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Omni 实时语音</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/style.css">
<body>
<header><strong>Omni <span>实时语音</span></strong><output id="status" role="status">未连接</output></header>
<main>
  <section class="stage" aria-label="实时字幕">
    <h2>实时字幕</h2>
    <div id="subtitles" aria-live="polite"></div>
  </section>
  <aside>
    <form id="connect-form">
      <h1>连接共享服务</h1>
      <label for="token">应用凭据</label><input id="token" type="password" required autocomplete="off" placeholder="Bearer token">
      <p class="hint">凭据仅保留在当前页面内存。麦克风和屏幕采集需要 HTTPS 或 localhost。</p>
      <div class="actions"><button id="connect" type="submit">连接麦克风</button><button id="disconnect" type="button" disabled>关闭会话</button></div>
    </form>
    <section aria-label="会话操作">
      <h2>会话操作</h2>
      <div class="actions"><button id="interrupt" disabled>打断</button><button id="screen" disabled>共享屏幕</button></div>
    </section>
    <section aria-label="事件"><h2>状态与事件</h2><pre id="events" role="log" aria-live="polite"></pre></section>
  </aside>
</main>
<script src="/app.js" defer></script>
</body></html>
