name: omni-avatar-node
services:
  omni-avatar:
    build: ./services/avatar
    image: omni-api-avatar:2d
    network_mode: host
    init: true
    restart: unless-stopped
    environment:
      OMNI_AVATAR_INTERNAL_TOKEN: ${OMNI_AVATAR_INTERNAL_TOKEN:?set internal token}
      OMNI_AVATAR_BIND: ${OMNI_AVATAR_BIND:-127.0.0.1}
      OMNI_AVATAR_PORT: ${OMNI_AVATAR_PORT:-8090}
      OMNI_PORTRAIT_URL: ${OMNI_PORTRAIT_URL:-}
