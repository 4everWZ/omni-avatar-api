name: omni-portrait-node
services:
  portrait-assets:
    profiles: [assets]
    image: ${OMNI_PORTRAIT_IMAGE:-omni-api-portrait:ditto}
    user: '0:0'
    command: [python, -m, portrait.assets]
    volumes:
      - ${OMNI_PORTRAIT_MODELS:-./data/portrait}:/portrait
  omni-portrait:
    build:
      context: ./services/portrait
      dockerfile: ${OMNI_PORTRAIT_DOCKERFILE:-Dockerfile}
    image: ${OMNI_PORTRAIT_IMAGE:-omni-api-portrait:ditto}
    init: true
    restart: unless-stopped
    runtime: nvidia
    gpus:
      - driver: nvidia
        device_ids: ["${PORTRAIT_GPU_DEVICE:?select the render device}"]
    ports:
      - '${PORTRAIT_PUBLISH_BIND:-127.0.0.1}:${PORTRAIT_PUBLISH_PORT:-8091}:8091'
    environment:
      PORTRAIT_BIND: 0.0.0.0
      OMNI_AVATAR_INTERNAL_TOKEN: ${OMNI_AVATAR_INTERNAL_TOKEN:?set internal token}
      OMNI_PORTRAIT_CAP: ${OMNI_PORTRAIT_CAP:-1}
      OMNI_PORTRAIT_FRAME_BACKEND: ${OMNI_PORTRAIT_FRAME_BACKEND:-cuda-graph}
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    volumes:
      - ${OMNI_PORTRAIT_MODELS:-./data/portrait}:/portrait:ro
      - portrait-data:/data
      - portrait-cache:/cache
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/livez', timeout=3).close()"]
      start_period: 2m
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  portrait-data:
  portrait-cache:
