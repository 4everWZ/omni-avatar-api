# Primary target profile. Combine with base.yml on a dual-GPU Linux workstation.
services:
  model-fetch:
    image: omni-api-engine:0.32.0-workstation
    platform: linux/amd64

  omni-engine:
    image: omni-api-engine:0.32.0-workstation
    platform: linux/amd64
    build:
      context: ./services/inference
      args:
        OMNI_BASE_IMAGE: vllm/vllm-omni:v0.32.0-x86_64@sha256:6b44ee504a0dc3a21eacf72e7dc5da318b7bcc8ed0e349dc928e67278414430c
    environment:
      OMNI_DEPLOY_CONFIG: /opt/tuber-omni/configs/minicpmo-workstation.yaml
    volumes: !override
      - type: bind
        source: ${OMNI_MODEL_DATA:-./data/models}
        target: /models
        read_only: true
      - ./services/inference/configs/minicpmo-workstation.yaml:/opt/tuber-omni/configs/minicpmo-workstation.yaml:ro

  omni-gateway:
    environment:
      OMNI_ENGINE_VERSION: vLLM-Omni 0.32.0 / vLLM 0.32.0 / CUDA 13.0.2 (workstation)
