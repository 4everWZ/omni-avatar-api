name: omni-gateway-node
services:
  omni-gateway:
    build: ./services/gateway
    restart: unless-stopped
    init: true
    ports:
      - '${OMNI_GATEWAY_BIND:-127.0.0.1}:${OMNI_GATEWAY_PORT:-8000}:8000'
    environment:
      OMNI_GATEWAY_TOKEN: ${OMNI_GATEWAY_TOKEN:?set application token}
      OMNI_GATEWAY_ADMIN_TOKEN: ${OMNI_GATEWAY_ADMIN_TOKEN:?set administrative token}
      OMNI_GATEWAY_TOKENS: ${OMNI_GATEWAY_TOKENS:-}
      OMNI_GATEWAY_OMNI_ENABLED: ${OMNI_GATEWAY_OMNI_ENABLED:-0}
      OMNI_ENGINE_URL: ${OMNI_ENGINE_URL:-}
      OMNI_MODEL_ID: ${OMNI_MODEL_ID:-}
      OMNI_CHECKPOINT: ${OMNI_CHECKPOINT:-}
      OMNI_REQUIRE_CHECKPOINT_ROOT: '1'
      OMNI_ENGINE_TOKEN: ${OMNI_ENGINE_TOKEN:-}
      OMNI_BATCH_CAP: ${OMNI_BATCH_CAP:-1}
      OMNI_SHARED_CAPACITY: ${OMNI_SHARED_CAPACITY:-0}
      OMNI_WORKSTATION_CAP: ${OMNI_WORKSTATION_CAP:-2}
      OMNI_QUEUE_TIMEOUT: ${OMNI_QUEUE_TIMEOUT:-5}
      OMNI_REQUEST_TIMEOUT: ${OMNI_REQUEST_TIMEOUT:-1200}
      OMNI_REALTIME_IDLE_TIMEOUT: ${OMNI_REALTIME_IDLE_TIMEOUT:-120}
      LLM_ENGINE_URL: ${LLM_ENGINE_URL:-}
      LLM_ENGINE_TOKEN: ${LLM_ENGINE_TOKEN:-}
      LLM_MODEL_ID: ${LLM_MODEL_ID:-}
      LLM_CHECKPOINT: ${LLM_CHECKPOINT:-}
      LLM_MAX_NUM_SEQS: ${LLM_MAX_NUM_SEQS:-4}
      LLM_TOKEN_BUDGET: ${LLM_TOKEN_BUDGET:-262144}
      LLM_QUEUE_LIMIT: ${LLM_QUEUE_LIMIT:-}
      LLM_QUEUE_TIMEOUT: ${LLM_QUEUE_TIMEOUT:-}
      LLM_REQUEST_TIMEOUT: ${LLM_REQUEST_TIMEOUT:-}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/livez', timeout=3).close()"]
