# Dual-RTX 3090 TP=2 overlay for Qwen3.8-27B on vLLM 0.34.0.
x-llm-tp2: &llm-tp2
  LLM_MODEL_ID: ${LLM_TP2_MODEL_ID:-ukisai/Swift-1.5-Qwen3.8-27b-INT4}
  LLM_CHECKPOINT: ${LLM_TP2_CHECKPOINT:-81a28ee75eb1cd469f209813a368a79a7e3db3bc}
  LLM_LORA_NAME: ${LLM_TP2_LORA_NAME:-}
  LLM_LORA_REPO_ID: ${LLM_TP2_LORA_REPO_ID:-}
  LLM_LORA_CHECKPOINT: ${LLM_TP2_LORA_CHECKPOINT:-}
  LLM_SPECULATIVE_METHOD: ${LLM_TP2_SPECULATIVE_METHOD:-mtp}
  LLM_DRAFT_MODEL_ID: ${LLM_TP2_DRAFT_MODEL_ID:-}
  LLM_DRAFT_CHECKPOINT: ${LLM_TP2_DRAFT_CHECKPOINT:-}

services:
  llm-model-fetch:
    image: omni-api-llm:0.34.0
    environment: *llm-tp2

  llm-engine:
    build:
      context: ./services/llm
      args:
        LLM_BASE_IMAGE: vllm/vllm-openai:v0.34.0@sha256:20fdb089454afbb324efa4110a2c025ff7b27cc1a086e07aa580b18df8ad1ce1
    image: omni-api-llm:0.34.0
    gpus: !override
      - driver: nvidia
        device_ids: ["${LLM_GPU_DEVICE_0:-0}", "${LLM_GPU_DEVICE_1:-1}"]
    shm_size: 16gb
    environment:
      <<: *llm-tp2
      LLM_TENSOR_PARALLEL_SIZE: '2'
      LLM_GPU_MEMORY_UTILIZATION: ${LLM_TP2_GPU_MEMORY_UTILIZATION:-0.80}
      LLM_KV_CACHE_BYTES: ${LLM_TP2_KV_CACHE_BYTES:-}
      LLM_KV_CACHE_DTYPE: ${LLM_TP2_KV_CACHE_DTYPE:-}
      LLM_MAX_MODEL_LEN: ${LLM_TP2_MAX_MODEL_LEN:-262144}
      LLM_MAX_NUM_SEQS: ${LLM_TP2_MAX_NUM_SEQS:-8}
      LLM_MAX_NUM_BATCHED_TOKENS: ${LLM_TP2_MAX_NUM_BATCHED_TOKENS:-8192}
      LLM_COMPILATION_MODE: ${LLM_TP2_COMPILATION_MODE:-0}
      LLM_CUDAGRAPH_CAPTURE_SIZES: ${LLM_TP2_CUDAGRAPH_CAPTURE_SIZES:-1,2,4,8,16,32}
      LLM_ASYNC_SCHEDULING: ${LLM_TP2_ASYNC_SCHEDULING:-1}
      LLM_ENABLE_PREFIX_CACHING: ${LLM_TP2_ENABLE_PREFIX_CACHING:-1}
      LLM_MAMBA_CACHE_MODE: ${LLM_TP2_MAMBA_CACHE_MODE:-}
      LLM_MAMBA_BLOCK_SIZE: ${LLM_TP2_MAMBA_BLOCK_SIZE:-4096}
      LLM_MM_ENCODER_TP_MODE: ${LLM_TP2_MM_ENCODER_TP_MODE:-weights}
      LLM_ENABLE_MTP: ${LLM_TP2_ENABLE_MTP:-1}
      LLM_MTP_NUM_SPECULATIVE_TOKENS: ${LLM_TP2_MTP_NUM_SPECULATIVE_TOKENS:-3}
      LLM_DRAFT_TENSOR_PARALLEL_SIZE: ${LLM_TP2_DRAFT_TENSOR_PARALLEL_SIZE:-2}
      LLM_NUM_SPECULATIVE_TOKENS: ${LLM_TP2_NUM_SPECULATIVE_TOKENS:-}
      LLM_ENABLE_LORA: ${LLM_TP2_ENABLE_LORA:-0}
      LLM_MAX_LORAS: ${LLM_TP2_MAX_LORAS:-2}
      LLM_MAX_LORA_RANK: ${LLM_TP2_MAX_LORA_RANK:-32}
      LLM_REASONING_PARSER: ${LLM_TP2_REASONING_PARSER:-qwen3}
      LLM_TOOL_CALL_PARSER: ${LLM_TP2_TOOL_CALL_PARSER:-qwen3_coder}
      LLM_STRUCTURED_OUTPUTS_BACKEND: ${LLM_TP2_STRUCTURED_OUTPUTS_BACKEND:-xgrammar}
    volumes:
      - ${OMNI_MODEL_DATA:-./data/models}:/models:ro
      - vllm-compile-cache:/root/.cache/vllm
      - triton-cache:/root/.triton
    healthcheck:
      start_period: 8m

  omni-gateway:
    environment:
      <<: *llm-tp2
      LLM_ENGINE_VERSION: vLLM 0.34.0
      LLM_MAX_NUM_SEQS: ${LLM_TP2_MAX_NUM_SEQS:-8}
      LLM_TOKEN_BUDGET: ${LLM_TP2_TOKEN_BUDGET:-262144}
      LLM_DEFAULT_THINKING_TOKEN_BUDGET: ${LLM_DEFAULT_THINKING_TOKEN_BUDGET:-16384}
      LLM_EXTRA_MODEL_ALIASES: ${LLM_TP2_EXTRA_MODEL_ALIASES:-}

volumes:
  vllm-compile-cache: {}
  triton-cache: {}
