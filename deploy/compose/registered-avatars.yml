services:
  omni-avatar:
    environment:
      OMNI_AVATAR_REGISTRY: /opt/omni-avatars/registry.json
    volumes:
      - type: bind
        source: ${OMNI_AVATAR_ASSETS_DIR:?provide the workstation directory containing registry.json and its rigs}
        target: /opt/omni-avatars
        read_only: true
        bind:
          create_host_path: false
