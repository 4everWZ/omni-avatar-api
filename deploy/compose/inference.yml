# Append after workstation + avatar: two GPU-isolated inference APIs, same host.
x-llm: &llm
  LLM_MODEL_ID: ${LLM_MODEL_ID:-axteam/Qwen3.5-9B-AWQ-4bit}
  LLM_CHECKPOINT: ${LLM_CHECKPOINT:-5577b5b71e6f06b9f6a1f3743ef6ba6dc4ecd2df}

services:
  omni-engine:
    gpus: !override
      - driver: nvidia
        device_ids: ["${OMNI_GPU_DEVICE:-1}"]
    environment:
      OMNI_MAX_MODEL_LEN: '8192'
      OMNI_WORKSTATION_CAP: ${OMNI_WORKSTATION_CAP:-2}
      OMNI_DEPLOY_CONFIG: /opt/tuber-omni/configs/minicpmo-assistant.yaml
    volumes:
      - ./services/inference/configs/minicpmo-assistant.yaml:/opt/tuber-omni/configs/minicpmo-assistant.yaml:ro

  llm-model-fetch:
    networks: [asset-download]

  llm-engine:
    networks: [engine-private]

  omni-gateway:
    environment:
      OMNI_SHARED_CAPACITY: '1'
      OMNI_WORKSTATION_CAP: ${OMNI_WORKSTATION_CAP:-2}
      <<: *llm
      LLM_ENGINE_URL: ${LLM_ENGINE_URL:-http://llm-engine:8000}
      LLM_QUEUE_LIMIT: ${LLM_QUEUE_LIMIT:-}
      LLM_QUEUE_TIMEOUT: ${LLM_QUEUE_TIMEOUT:-}
      LLM_REQUEST_TIMEOUT: ${LLM_REQUEST_TIMEOUT:-}
      LLM_MAX_NUM_SEQS: ${LLM_MAX_NUM_SEQS:-4}
      LLM_TOKEN_BUDGET: ${LLM_TOKEN_BUDGET:-262144}
